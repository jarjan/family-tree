<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Cyan to Emerald gradient matching the app's styling -->
    <linearGradient id="treeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Stylized modern family tree (Shezhire / Tree of Life) -->
  <g stroke="url(#treeGrad)" stroke-linecap="round" fill="none">
    <!-- Outer glassmorphic-style ring representing the family circle -->
    <circle cx="256" cy="256" r="220" stroke-width="20" stroke-dasharray="1000 280" transform="rotate(-45 256 256)" opacity="0.85" />
    
    <!-- Trunk / Main Root -->
    <path d="M256,430 L256,310" stroke-width="26" />
    
    <!-- First layer branches (representing ancestors/descendants) -->
    <path d="M256,310 Q256,250 160,230" stroke-width="18" />
    <path d="M256,310 Q256,250 352,230" stroke-width="18" />
    <path d="M256,310 L256,190" stroke-width="18" />
    
    <!-- Second layer branches -->
    <!-- Left branch subdivision -->
    <path d="M160,230 Q120,230 100,150" stroke-width="12" />
    <path d="M160,230 Q200,230 210,150" stroke-width="12" />
    
    <!-- Right branch subdivision -->
    <path d="M352,230 Q312,230 302,150" stroke-width="12" />
    <path d="M352,230 Q392,230 412,150" stroke-width="12" />
    
    <!-- Middle branch subdivision -->
    <path d="M256,190 Q220,170 200,110" stroke-width="12" />
    <path d="M256,190 Q292,170 312,110" stroke-width="12" />
  </g>

  <!-- Interactive Nodes (representing generations) -->
  <g fill="url(#treeGrad)">
    <!-- Root node -->
    <circle cx="256" cy="310" r="20" />
    
    <!-- Generation 2 nodes -->
    <circle cx="160" cy="230" r="16" />
    <circle cx="352" cy="230" r="16" />
    <circle cx="256" cy="190" r="16" />
    
    <!-- Generation 3 nodes -->
    <circle cx="100" cy="150" r="12" />
    <circle cx="210" cy="150" r="12" />
    <circle cx="200" cy="110" r="12" />
    <circle cx="312" cy="110" r="12" />
    <circle cx="302" cy="150" r="12" />
    <circle cx="412" cy="150" r="12" />
  </g>
  
  <!-- Central focus node with a glow -->
  <circle cx="256" cy="100" r="8" fill="#ffffff" filter="url(#glow)" />
</svg>
